name: coran_karim
description: "Application de mémorisation du Coran assistée par IA"
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Fonts (Google Fonts — Amiri, Scheherazade New)
  google_fonts: ^6.2.1

  # Shared preferences
  shared_preferences: ^2.3.5

  # Audio playback
  audioplayers: ^6.1.1

  # Synthèse vocale on-device (lecture des explications par langue, fr/en/ar) —
  # moteur natif du téléphone (Google TTS), gratuit et offline.
  flutter_tts: ^4.2.0

  # Audio recording (ASR on-device = FastConformer CTC, voir fastconformer_verifier.dart)
  record: ^5.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # flutter_gemma / flutter_gemma_litertlm RETIRÉS le 2026-08-10.
  #
  # Le tuteur textuel Gemma n'a jamais été livré : le `.litertlm` n'était ni
  # embarqué ni téléchargé, `explainVerse` rendait toujours `null`, et aucun
  # utilisateur n'a vu une ligne produite par ce modèle.
  #
  # Mesuré sur l'APK release du 2026-08-10, ces deux paquets apportaient
  # ~90 Mo de bibliothèques natives PAR ARCHITECTURE (libLiteRtLm 24,8 Mo,
  # quatre libQnnHtpV*Skel 42,4 Mo, deux accélérateurs LiteRT 15,7 Mo,
  # libGemmaModelConstraintProvider, libQnnSystem) — plus de la moitié de la
  # charge utile arm64.
  #
  # Ce que ça libère : de la place pour le modèle ASR dans le paquet lui-même
  # (cf. PUBLICATION_PLAY.md §2.2). Les remettre le jour où le tuteur est
  # réellement embarqué — et repasser alors `kTuteurIaEmbarque` à `true` dans
  # `about_screen.dart`, qui rétablit la notice Gemma et l'avertissement sur
  # le texte généré.

  # Boussole Qibla (direction de la Mecque)
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3

  # Horaires de prière : calcul LOCAL (pas d'API réseau, cohérent avec le
  # reste de l'app -- Coran/ASR déjà embarqués sur l'appareil), + adhan
  # programmé (notifications locales exactes).
  adhan_dart: ^1.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Export des clips vocaux vérifiés (mini-LoRA personnalisation, cf.
  # VoiceLoraClipService) : partage manuel (pas de sync automatique) +
  # empaquetage zip.
  share_plus: ^13.2.0
  archive: ^3.6.1

  # Carte mentale des sourates (REFONTE_IHM.md §7) — rendu eventail gauche/droite
  graphview: ^1.2.0
  flutter_svg: ^2.3.0

  # "Nous contacter" (2026-08-09) : écran de composition dans l'app, envoi
  # via mailto: au moment de "Envoyer" -- aucun backend/Firebase, l'appli
  # mail du téléphone fait le transport (cf. décision utilisateur : pas de
  # cause à ajouter un serveur pour un simple formulaire de contact).
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.0
  audio_service: ^0.18.19
  upgrader: ^13.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  # Icone de lancement (PUBLICATION_PLAY.md §2.4) : genere les mipmap-* Android
  # a partir de assets/icon/app_icon.png, qui remplacait jusqu'ici le logo
  # Flutter par defaut UNIQUEMENT dans l'app (about_screen), pas sur l'icone
  # de lancement elle-meme. `dart run flutter_launcher_icons` regenere les PNG.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  # Pas de remove_alpha_ios : app Android uniquement (pas de cible iOS ici).

dependency_overrides:
  record_linux:
    path: ../patches/record_linux

flutter:
  uses-material-design: true
  generate: true
  # ── ECRITURE MAGHRIBI (2026-09-03) ────────────────────────────────────
  #
  # `Bouazzi Maghribi` -- revival de la main du Dr Ahmed Bouazzi par Alef Type
  # Foundry, licence MIT annoncee dans le README du depot
  # (github.com/aleftypefoundry/bouazzi-maghribi). 56 Ko.
  #
  # Declaree sous `fonts:` et NON dans `google_fonts/` : elle n'est pas au
  # catalogue Google Fonts, donc `GoogleFonts.getFont` ne saurait pas la
  # trouver. Elle se designe par `TextStyle(fontFamily: 'Bouazzi Maghribi')`
  # -- cf. le champ `locale` de `kEcrituresMushaf`.
  #
  # ⚠️ 4 des 19 signes coraniques seulement (mesure fontTools) : ni medaillon
  # de fin de verset, ni sajda, ni marques de waqf. Lettres et harakat de base
  # completes. C'est une police pour VOIR le style marocain, pas pour lire un
  # mushaf entier -- l'ecran l'annonce par son « 4/19 ».
  fonts:
    - family: Bouazzi Maghribi
      fonts:
        - asset: fonts/BouazziMaghribi-Regular.ttf

  assets:
    # ── AMIRI EMBARQUEE (2026-09-03) ────────────────────────────────────
    #
    # Jusqu'ici AUCUNE police n'etait dans l'APK : `google_fonts` les
    # telechargeait toutes au premier lancement. La police du CORAN dependait
    # donc du reseau -- sur un telephone jamais connecte depuis l'installation,
    # Flutter se rabattait sur la police systeme, qui ne dessine ni le
    # medaillon de fin de verset ni les marques de waqf. Le TEXTE, lui, est
    # local depuis le commit « Coran 100 % local » ; sa police ne l'etait pas.
    #
    # Amiri seule est embarquee (825 Ko : Regular 421 + Bold 404) : c'est
    # l'ecriture par defaut. Les onze autres du selecteur restent en
    # telechargement a la demande -- elles ne servent qu'a l'essai, et les
    # embarquer couterait 3,8 Mo pour un usage ponctuel.
    #
    # ⚠️ NE PAS RENOMMER ces fichiers et NE PAS les declarer sous `fonts:` :
    # `google_fonts` les reconnait par leur nom officiel (`Amiri-Regular.ttf`,
    # `Amiri-Bold.ttf`) et donne alors la priorite au fichier local sur le
    # reseau. Un nom modifie casse cette reconnaissance en silence -- la police
    # repasserait par HTTP sans que rien ne le signale.
    #
    # `w600` (le poids du texte de la page) n'existe pas chez Amiri, qui n'a
    # que 400 et 700 : c'est le Bold qui sert, d'ou les deux fichiers.
    - google_fonts/
    - assets/icon/app_icon.png
    - assets/mindmaps/fr/
    - assets/mindmaps/en/
    - assets/mindmaps/ar/
    - assets/illumination/
    - assets/data/quran_search_index.json
    # Index de recherche du texte Warsh (Shazam, suivi de prière, ancre de
    # récitation) -- cf. benchmark/build_warsh_search_index.py.
    - assets/data/quran_search_index_warsh.json
    - assets/data/quran_chapters.json
    # motif_bandeau.webp RETIRE le 2026-09-03 : la vue Page utilise
    # desormais l ornement de l ecran de lecture (SurahOrnamentHeader en
    # compact), le motif du scan n est plus affiche nulle part. Le fichier
    # reste sur le disque, seule sa declaration part -- le rebrancher tient
    # a decommenter la ligne ci-dessous.
    # - assets/images/motif_bandeau.webp
    - assets/data/quran_verses.json
    # ── DECOUPAGE EN LIGNES DU MUSHAF (2026-09-04) ──────────────────────
    # 604 pages x 15 lignes, mots de debut et de fin de CHAQUE ligne. Sans
    # lui, la vue Page laissait Flutter couper ou il voulait : le decoupage
    # dependait de la police et de la largeur, alors qu'un mushaf a des
    # lignes FIXES (« chaque ligne commence et finit avec les memes mots,
    # quel que soit le type d'ecriture »). Frontieres seules, 337 Ko -- le
    # texte reste celui de quran_verses.json.
    - assets/data/mushaf_lignes.json
    # Texte Warsh (riwaya Warsh 'an Nafi', source KFGQPC) -- meme forme et
    # memes cles de verset que l'asset ci-dessus, cf.
    # benchmark/build_warsh_verses_asset.py pour le pourquoi de ce choix.
    - assets/data/quran_verses_warsh.json
    # Pagination native du Mushaf papier Warsh, sans images (affichage seul).
    - assets/data/quran_mushaf_warsh.json
    - assets/data/rule_reliability.json
    - assets/data/gop_word_baseline.json
    - assets/data/quran_rules_annotated.json
    - assets/data/quran_rules_boundary.json
    - assets/data/word_timings_ms.json
    - assets/data/word_segments_mp3quran_afasy.json
    - assets/data/coupes_palier_afasy.json
    # Coupes de palier PRECALCULEES sur tout le Coran (2026-09-06) --
    # waqf Hafs union Warsh, liaisons, groupes figes. Cf.
    # benchmark/build_coupes_paliers.py pour la methode et les mesures.
    - assets/data/coupes_paliers.json
    - assets/illumination/medallion.svg
    - assets/illumination/quran_pattern_tile.svg
    - assets/audio/adhan_makkah.mp3
    # Dossier retiré le 2026-08-10 avec les 11 `*_cut.mp3` (copies découpées de
    # hisnmuslim.com, redistribuées sans licence). La coupe se fait désormais à
    # la lecture, cf. `Dua.audioCutMs`. À rétablir le jour où des
    # enregistrements dont on possède les droits seront embarqués.
    # - assets/audio/duas/
