name: coran_karim
description: "Application de mémorisation du Coran assistée par IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Fonts (Google Fonts — Amiri, Scheherazade New)
  google_fonts: ^6.2.1

  # Shared preferences
  shared_preferences: ^2.3.5

  # Audio playback
  audioplayers: ^6.1.1

  # Synthèse vocale on-device (lecture des explications par langue, fr/en/ar) —
  # moteur natif du téléphone (Google TTS), gratuit et offline.
  flutter_tts: ^4.2.0

  # Audio recording (ASR on-device = FastConformer CTC, voir fastconformer_verifier.dart)
  record: ^5.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # flutter_gemma / flutter_gemma_litertlm RETIRÉS le 2026-08-10.
  #
  # Le tuteur textuel Gemma n'a jamais été livré : le `.litertlm` n'était ni
  # embarqué ni téléchargé, `explainVerse` rendait toujours `null`, et aucun
  # utilisateur n'a vu une ligne produite par ce modèle.
  #
  # Mesuré sur l'APK release du 2026-08-10, ces deux paquets apportaient
  # ~90 Mo de bibliothèques natives PAR ARCHITECTURE (libLiteRtLm 24,8 Mo,
  # quatre libQnnHtpV*Skel 42,4 Mo, deux accélérateurs LiteRT 15,7 Mo,
  # libGemmaModelConstraintProvider, libQnnSystem) — plus de la moitié de la
  # charge utile arm64.
  #
  # Ce que ça libère : de la place pour le modèle ASR dans le paquet lui-même
  # (cf. PUBLICATION_PLAY.md §2.2). Les remettre le jour où le tuteur est
  # réellement embarqué — et repasser alors `kTuteurIaEmbarque` à `true` dans
  # `about_screen.dart`, qui rétablit la notice Gemma et l'avertissement sur
  # le texte généré.

  # Boussole Qibla (direction de la Mecque)
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3

  # Horaires de prière : calcul LOCAL (pas d'API réseau, cohérent avec le
  # reste de l'app -- Coran/ASR déjà embarqués sur l'appareil), + adhan
  # programmé (notifications locales exactes).
  adhan_dart: ^1.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Export des clips vocaux vérifiés (mini-LoRA personnalisation, cf.
  # VoiceLoraClipService) : partage manuel (pas de sync automatique) +
  # empaquetage zip.
  share_plus: ^13.2.0
  archive: ^3.6.1

  # Carte mentale des sourates (REFONTE_IHM.md §7) — rendu eventail gauche/droite
  graphview: ^1.2.0
  flutter_svg: ^2.3.0

  # "Nous contacter" (2026-08-09) : écran de composition dans l'app, envoi
  # via mailto: au moment de "Envoyer" -- aucun backend/Firebase, l'appli
  # mail du téléphone fait le transport (cf. décision utilisateur : pas de
  # cause à ajouter un serveur pour un simple formulaire de contact).
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  # Icone de lancement (PUBLICATION_PLAY.md §2.4) : genere les mipmap-* Android
  # a partir de assets/icon/app_icon.png, qui remplacait jusqu'ici le logo
  # Flutter par defaut UNIQUEMENT dans l'app (about_screen), pas sur l'icone
  # de lancement elle-meme. `dart run flutter_launcher_icons` regenere les PNG.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  # Pas de remove_alpha_ios : app Android uniquement (pas de cible iOS ici).

dependency_overrides:
  record_linux:
    path: ../patches/record_linux

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/app_icon.png
    - assets/mindmaps/fr/
    - assets/mindmaps/en/
    - assets/mindmaps/ar/
    - assets/illumination/
    - assets/data/quran_search_index.json
    - assets/data/quran_chapters.json
    - assets/data/quran_verses.json
    - assets/data/rule_reliability.json
    - assets/data/gop_word_baseline.json
    - assets/data/quran_rules_annotated.json
    - assets/data/quran_rules_boundary.json
    - assets/data/word_timings_ms.json
    - assets/data/word_segments_mp3quran_afasy.json
    - assets/data/coupes_palier_afasy.json
    - assets/illumination/medallion.svg
    - assets/illumination/quran_pattern_tile.svg
    - assets/audio/adhan_makkah.mp3
    # Dossier retiré le 2026-08-10 avec les 11 `*_cut.mp3` (copies découpées de
    # hisnmuslim.com, redistribuées sans licence). La coupe se fait désormais à
    # la lecture, cf. `Dua.audioCutMs`. À rétablir le jour où des
    # enregistrements dont on possède les droits seront embarqués.
    # - assets/audio/duas/
